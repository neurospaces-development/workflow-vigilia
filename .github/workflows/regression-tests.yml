name: Regression tests

on:
  push:
    branches:
      - master
      - ci/regression-integration
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      docker_modules:
        description: 'Optional focused Docker modules (comma-separated paths relative to vigilia/specifications/)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  regression-tests:
    # The unfiltered full job already covers these tests on trusted pushes.
    # Keep a fast, non-Docker check for pull requests only.
    if: github.event_name == 'pull_request'
    name: Vigilia ${{ matrix.profile }} (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [regression]
    env:
      CI_RESULTS_DIR: ${{ github.workspace }}/ci-results
      VIGILIA_TEST_PROFILE: ${{ matrix.profile }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        shell: bash
        run: |
          mkdir -p "$CI_RESULTS_DIR"
          set -o pipefail
          ./ci/install-dependencies.sh 2>&1 | tee "$CI_RESULTS_DIR/deps.log"

      - name: Build, install and run selected regression tests
        shell: bash
        run: ./ci/test.sh

      # This check must fail internally: an empty module selection cannot
      # satisfy the quality gate. Keep its evidence separate from the positive
      # run while allowing the overall job to succeed when rejection works.
      - name: Verify rejection of an empty test selection
        shell: bash
        run: |
          set -euo pipefail
          probe_root="$CI_RESULTS_DIR/negative-probe"
          if CI_RESULTS_DIR="$probe_root" \
             VIGILIA_REGEX_SELECTOR='^__vigilia_ci_no_such_module__$' \
             ./ci/test.sh --test-only; then
            echo '::error::Empty test selection unexpectedly passed the CI gate'
            exit 1
          fi
          shopt -s nullglob
          runs=("$probe_root"/run.*)
          if (( ${#runs[@]} != 1 )); then
            echo '::error::Expected exactly one negative-probe evidence directory'
            exit 1
          fi
          probe="${runs[0]}"
          for stage in make-check validate-report; do
            status_file="$probe/$stage.exit-code.txt"
            if [[ ! -f "$status_file" ]] ||
               [[ $(<"$status_file") == 0 ]]; then
              echo "::error::$stage did not reject the empty selection"
              exit 1
            fi
          done
          if [[ -f "$probe/report/report.yml" ]]; then
            echo '::error::Empty selection unexpectedly produced a native report'
            exit 1
          fi
          echo 'Negative probe passed: empty selection rejected by both quality gates.'

      - name: Upload native verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vigilia-results-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/
          retention-days: 30
          if-no-files-found: warn

  # Explicit, focused investigations only; never repeat the full test suite
  # on routine pushes. workflow_dispatch is initiated by repository editors.
  docker-pilot:
    name: Vigilia focused Docker modules (Ubuntu 24.04)
    if: github.event_name == 'workflow_dispatch' && inputs.docker_modules != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI_RESULTS_DIR: ${{ github.workspace }}/ci-results
      VIGILIA_DOCKER_MODULES: ${{ inputs.docker_modules }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Docker daemon access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CI_RESULTS_DIR"
          {
            id
            docker version
            docker info
          } > "$CI_RESULTS_DIR/docker-preflight.log" 2>&1 || {
            rc=$?
            cat "$CI_RESULTS_DIR/docker-preflight.log" >&2
            exit "$rc"
          }

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./ci/install-dependencies.sh > "$CI_RESULTS_DIR/deps.log" 2>&1 || {
            rc=$?
            tail -n 60 "$CI_RESULTS_DIR/deps.log" >&2
            exit "$rc"
          }

      - name: Build, install and execute Docker modules serially
        shell: bash
        run: ./ci/docker-suite.sh

      - name: Preserve Docker diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "$CI_RESULTS_DIR"
          docker ps -a > "$CI_RESULTS_DIR/docker-containers.log" 2>&1 || true
          docker network ls > "$CI_RESULTS_DIR/docker-networks.log" 2>&1 || true
          docker image ls > "$CI_RESULTS_DIR/docker-images.log" 2>&1 || true
          docker logs vigilia_test_container > "$CI_RESULTS_DIR/docker-container.log" 2>&1 || true

      # Keep the existing artifact name for compatibility with the REST downloader.
      - name: Upload Docker suite evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vigilia-docker-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/
          retention-days: 30
          if-no-files-found: warn

  # Authoritative quality gate on trusted pushes, without a parallel Docker
  # subset or smoke/regression matrix. Never execute privileged full on PRs.
  full-tests:
    name: Vigilia full knowledge base (Ubuntu 24.04)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/ci/regression-integration')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI_RESULTS_DIR: ${{ github.workspace }}/ci-results
      VIGILIA_TEST_PROFILE: full
      VIGILIA_ALLOW_FULL: '1'
      VIGILIA_DOCKER_NETWORK_SUBNET: auto

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Docker daemon access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CI_RESULTS_DIR"
          docker version > "$CI_RESULTS_DIR/docker-preflight.log" 2>&1
          docker info >> "$CI_RESULTS_DIR/docker-preflight.log" 2>&1

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./ci/install-dependencies.sh > "$CI_RESULTS_DIR/deps.log" 2>&1 || {
            rc=$?
            tail -n 60 "$CI_RESULTS_DIR/deps.log" >&2
            exit "$rc"
          }

      - name: Run the complete unfiltered Vigilia knowledge base
        shell: bash
        run: ./ci/test.sh

      - name: Preserve Docker diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "$CI_RESULTS_DIR"
          docker ps -a > "$CI_RESULTS_DIR/docker-containers.log" 2>&1 || true
          docker network ls > "$CI_RESULTS_DIR/docker-networks.log" 2>&1 || true
          docker image ls > "$CI_RESULTS_DIR/docker-images.log" 2>&1 || true
          docker logs vigilia_test_container > "$CI_RESULTS_DIR/docker-container.log" 2>&1 || true

      - name: Upload full-suite evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vigilia-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/
          retention-days: 30
          if-no-files-found: warn
