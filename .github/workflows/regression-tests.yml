name: Regression tests

on:
  push:
    branches:
      - master
      - ci/regression-integration
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    name: Vigilia regression (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI_RESULTS_DIR: ${{ github.workspace }}/ci-results
      VIGILIA_REGEX_SELECTOR: '20_vigilia/13_inspection_exit_code'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        shell: bash
        run: |
          mkdir -p "$CI_RESULTS_DIR"
          set -o pipefail
          ./ci/install-dependencies.sh 2>&1 | tee "$CI_RESULTS_DIR/deps.log"

      - name: Build, install and run selected regression tests
        shell: bash
        run: ./ci/test.sh

      - name: Upload native verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vigilia-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/
          retention-days: 30
          if-no-files-found: warn
