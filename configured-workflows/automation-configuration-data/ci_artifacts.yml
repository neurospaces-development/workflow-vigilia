---
ci_artifacts:
  branch: ci/regression-integration
  providers:
    - github
    - gitlab
  profiles:
    - smoke
    - regression
  github:
    repository: neurospaces-development/workflow-vigilia
    workflow: regression-tests.yml
    api_base: https://api.github.com
    artifact_names:
      smoke: vigilia-results-smoke-{run_id}-{attempt}
      regression: vigilia-results-regression-{run_id}-{attempt}
      docker: vigilia-docker-pilot-{run_id}-{attempt}
  gitlab:
    project: neurospaces-development/workflow-vigilia
    job_prefix: vigilia-regression
    api_base: https://gitlab.com/api/v4
    job_names:
      smoke: 'vigilia-regression: [smoke]'
      regression: 'vigilia-regression: [regression]'
      docker: vigilia-docker-pilot
  selection:
    mode: latest-successful
  download:
    directory: ci-artifacts
