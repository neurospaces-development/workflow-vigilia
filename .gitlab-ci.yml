# Hosted CI: full, unfiltered Vigilia testing on trusted branch pushes.
# Focused smoke/regression or Docker tests can be launched manually.
# Untrusted merge-request code
# must not receive passwordless sudo in a privileged CI job container.
# GitLab's Ubuntu job container starts as root, while ci/test.sh deliberately
# refuses to run as root. Bootstrap an unprivileged account within the
# disposable container and grant passwordless sudo only inside that container.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "ci/regression-integration")'
    # Developers may manually start focused tests on other branches.
    - if: '$CI_PIPELINE_SOURCE == "web"'

stages:
  - test

vigilia-regression:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  image: ubuntu:24.04
  timeout: 60 minutes
  parallel:
    matrix:
      - VIGILIA_TEST_PROFILE: [smoke, regression]
  variables:
    DEBIAN_FRONTEND: noninteractive
  script:
    - |
      set -euo pipefail
      export CI_RESULTS_DIR="$CI_PROJECT_DIR/ci-results"
      mkdir -p "$CI_RESULTS_DIR"

      # GitLab.com hosted Linux jobs use a disposable VM with a Docker
      # executor. Bootstrap only this job container; do not share a host.
      if (( EUID != 0 )); then
        echo 'Expected a root-owned Ubuntu job container for bootstrap' >&2
        exit 2
      fi
      apt-get update > "$CI_RESULTS_DIR/bootstrap.log" 2>&1
      apt-get install -y --no-install-recommends sudo ca-certificates \
        >> "$CI_RESULTS_DIR/bootstrap.log" 2>&1
      useradd --create-home --shell /bin/bash vigilia-ci
      printf 'vigilia-ci ALL=(ALL) NOPASSWD:ALL\n' \
        > /etc/sudoers.d/90-vigilia-ci
      chmod 0440 /etc/sudoers.d/90-vigilia-ci
      chown -R vigilia-ci:vigilia-ci "$CI_PROJECT_DIR"

      # Reuse the exact installation and CI gate used in GitHub Actions.
      # Provisioning output remains available in the always-uploaded artifact.
      sudo -H -u vigilia-ci ./ci/install-dependencies.sh \
        > "$CI_RESULTS_DIR/deps.log" 2>&1 || {
          rc=$?
          tail -50 "$CI_RESULTS_DIR/deps.log" >&2
          exit "$rc"
        }
      sudo -H -u vigilia-ci env \
        CI_RESULTS_DIR="$CI_RESULTS_DIR" \
        VIGILIA_TEST_PROFILE="$VIGILIA_TEST_PROFILE" \
        ./ci/test.sh

      # Negative probe: the internal CI gate must reject an empty selection.
      # The overall GitLab job succeeds only when rejection is confirmed.
      probe_root="$CI_RESULTS_DIR/negative-probe"
      if sudo -H -u vigilia-ci env \
         CI_RESULTS_DIR="$probe_root" \
         VIGILIA_TEST_PROFILE="$VIGILIA_TEST_PROFILE" \
         VIGILIA_REGEX_SELECTOR='^__vigilia_ci_no_such_module__$' \
         ./ci/test.sh --test-only; then
        echo 'ERROR: Empty selection unexpectedly passed the CI gate' >&2
        exit 1
      fi
      shopt -s nullglob
      runs=("$probe_root"/run.*)
      if (( ${#runs[@]} != 1 )); then
        echo 'ERROR: Expected exactly one negative-probe evidence directory' >&2
        exit 1
      fi
      probe="${runs[0]}"
      for stage in make-check validate-report; do
        status_file="$probe/$stage.exit-code.txt"
        if [[ ! -f "$status_file" ]] || [[ $(<"$status_file") == 0 ]]; then
          echo "ERROR: $stage did not reject the empty selection" >&2
          exit 1
        fi
      done
      if [[ -f "$probe/report/report.yml" ]]; then
        echo 'ERROR: Empty selection unexpectedly produced a native report' >&2
        exit 1
      fi
      echo 'Negative probe passed: empty selection rejected by both quality gates.'
  artifacts:
    when: always
    expire_in: 30 days
    name: 'vigilia-$CI_JOB_ID-$CI_COMMIT_SHORT_SHA'
    paths:
      - ci-results/

# Opt-in Docker-in-Docker diagnostics, never a duplicate automatic full run.
# Manual pipelines may be started by trusted developers on development branches.
# GitLab.com's saas-linux-small-amd64 hosted runner supports privileged DinD.
vigilia-docker-pilot:
  stage: test
  image: ubuntu:24.04
  tags:
    - saas-linux-small-amd64
  timeout: 90 minutes
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  # Ubuntu 24.04 currently supplies Docker CLI 29.1.3, which can talk
  # to Engine 28.5.2 (API 1.51). The Docker-role test image additionally
  # installs Debian Bookworm's Docker 20.10 CLI (API 1.41). Engine 29
  # rejects that older client (minimum API 1.44), whereas Engine 28
  # supports both clients. Pin this service to Engine 28 until the test
  # image is updated; retain the existing TLS configuration.
  services:
    - name: docker:28.5.2-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2376"
  variables:
    DEBIAN_FRONTEND: noninteractive
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    # The fixed 172.18/16 subnet conflicts with a network in the DinD daemon.
    VIGILIA_DOCKER_NETWORK_SUBNET: 'auto'
  script:
    - |
      set -euo pipefail
      export CI_RESULTS_DIR="$CI_PROJECT_DIR/ci-results"
      mkdir -p "$CI_RESULTS_DIR"

      # The Docker daemon runs in a privileged, disposable service container.
      # Preserve diagnostics on failure, including when provisioning fails.
      capture_docker_diagnostics() {
        local rc=$?
        docker ps -a > "$CI_RESULTS_DIR/docker-containers.log" 2>&1 || true
        docker network ls > "$CI_RESULTS_DIR/docker-networks.log" 2>&1 || true
        docker image ls > "$CI_RESULTS_DIR/docker-images.log" 2>&1 || true
        docker logs vigilia_test_container > "$CI_RESULTS_DIR/docker-container.log" 2>&1 || true
        exit "$rc"
      }
      trap capture_docker_diagnostics EXIT

      if (( EUID != 0 )); then
        echo 'Expected root for disposable job-container bootstrap' >&2
        exit 2
      fi
      apt-get update > "$CI_RESULTS_DIR/bootstrap.log" 2>&1
      apt-get install -y --no-install-recommends \
        sudo ca-certificates docker.io \
        >> "$CI_RESULTS_DIR/bootstrap.log" 2>&1 || {
          rc=$?
          tail -n 60 "$CI_RESULTS_DIR/bootstrap.log" >&2
          exit "$rc"
        }
      useradd --create-home --shell /bin/bash vigilia-ci
      printf 'vigilia-ci ALL=(ALL) NOPASSWD:ALL\n' \
        > /etc/sudoers.d/90-vigilia-ci
      chmod 0440 /etc/sudoers.d/90-vigilia-ci
      chown -R vigilia-ci:vigilia-ci "$CI_PROJECT_DIR"

      # Detect a future Ubuntu docker.io upgrade before contacting DinD.
      # Client 29.1.3 and daemon 28.5.2 have overlapping API versions;
      # the older CLI in the nested test image also requires Engine 28.
      docker_client_version=$(docker --version)
      printf '%s\n' "$docker_client_version" > "$CI_RESULTS_DIR/docker-client-version.log"
      if [[ ! $docker_client_version =~ (^|[[:space:]])29[.]1[.]3, ]]; then
        printf 'Expected Docker CLI 29.1.3 (compatible with docker:28.5.2-dind); got: %s\n' \
          "$docker_client_version" >&2
        exit 2
      fi

      # GitLab-hosted TLS DinD shares /certs/client with the job container.
      # Copy the client certificate/key into a private user-owned directory;
      # never upload them as artifacts or expose them to tested containers.
      cert_dir=/home/vigilia-ci/.docker/client
      install -d -m 0700 -o vigilia-ci -g vigilia-ci "$cert_dir"
      for cert in ca.pem cert.pem key.pem; do
        if [[ ! -s /certs/client/$cert ]]; then
          echo "Missing DinD TLS client certificate: $cert" >&2
          exit 2
        fi
        install -m 0600 -o vigilia-ci -g vigilia-ci \
          "/certs/client/$cert" "$cert_dir/$cert"
      done

      # The service may still be starting after the certificates appear.
      docker_ok=0
      for attempt in {1..30}; do
        if sudo -H -u vigilia-ci env \
           DOCKER_HOST="$DOCKER_HOST" DOCKER_TLS_VERIFY="$DOCKER_TLS_VERIFY" \
           DOCKER_CERT_PATH="$cert_dir" docker info \
           > "$CI_RESULTS_DIR/docker-preflight.log" 2>&1; then
          docker_ok=1
          break
        fi
        sleep 2
      done
      if (( docker_ok == 0 )); then
        cat "$CI_RESULTS_DIR/docker-preflight.log" >&2
        exit 2
      fi
      sudo -H -u vigilia-ci env \
        DOCKER_HOST="$DOCKER_HOST" DOCKER_TLS_VERIFY="$DOCKER_TLS_VERIFY" \
        DOCKER_CERT_PATH="$cert_dir" docker version \
        >> "$CI_RESULTS_DIR/docker-preflight.log" 2>&1

      # Reuse the same serial Docker module list and Vigilia CI entry point
      # as GitHub; only daemon access and job bootstrap differ.
      sudo -H -u vigilia-ci ./ci/install-dependencies.sh \
        > "$CI_RESULTS_DIR/deps.log" 2>&1 || {
          rc=$?
          tail -n 60 "$CI_RESULTS_DIR/deps.log" >&2
          exit "$rc"
        }
      # Full runs use the identical unfiltered selection as local bin/vigilia;
      # leave the 22-module isolation regression unchanged.
      if [[ ${VIGILIA_DOCKER_EXECUTION:-modules} == full ]]; then
        sudo -H -u vigilia-ci env \
          CI_RESULTS_DIR="$CI_RESULTS_DIR" \
          VIGILIA_TEST_PROFILE=full VIGILIA_ALLOW_FULL=1 \
          VIGILIA_DOCKER_NETWORK_SUBNET="$VIGILIA_DOCKER_NETWORK_SUBNET" \
          DOCKER_HOST="$DOCKER_HOST" \
          DOCKER_TLS_VERIFY="$DOCKER_TLS_VERIFY" \
          DOCKER_CERT_PATH="$cert_dir" \
          ./ci/test.sh
      else
        sudo -H -u vigilia-ci env \
          CI_RESULTS_DIR="$CI_RESULTS_DIR" \
          VIGILIA_DOCKER_NETWORK_SUBNET="$VIGILIA_DOCKER_NETWORK_SUBNET" \
          DOCKER_HOST="$DOCKER_HOST" \
          DOCKER_TLS_VERIFY="$DOCKER_TLS_VERIFY" \
          DOCKER_CERT_PATH="$cert_dir" \
          VIGILIA_DOCKER_MODULES="${VIGILIA_DOCKER_MODULES:-}" \
          ./ci/docker-suite.sh
      fi
  artifacts:
    when: always
    expire_in: 30 days
    # Keep the existing job/artifact name for REST downloader compatibility.
    name: 'vigilia-docker-pilot-$CI_JOB_ID-$CI_COMMIT_SHORT_SHA'
    paths:
      - ci-results/

# Full, unfiltered knowledge-base execution on trusted branch pushes only.
# Reuse the same disposable DinD bootstrap but override the parent's manual rule.
vigilia-full:
  extends: vigilia-docker-pilot
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "ci/regression-integration")'
  timeout: 90 minutes
  variables:
    VIGILIA_DOCKER_EXECUTION: full
  artifacts:
    when: always
    expire_in: 30 days
    name: 'vigilia-full-$CI_JOB_ID-$CI_COMMIT_SHORT_SHA'
    paths:
      - ci-results/
